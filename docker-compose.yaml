# ─────────────────────────────────────────────────────────────────────────────
# Embedding-Prototypen – Docker Compose
#
# Verwaltet die beiden Embedding-Prototypen als separate Services.
# Jeder Service hat sein eigenes Dockerfile unter src/<prototyp>/Dockerfile.
#
# Schnellstart:
#   docker compose build sbert          # Image bauen
#   docker compose run sbert            # SBERT-Evaluation ausführen
#   docker compose build word2vec       # Image bauen
#   docker compose run word2vec         # Word2Vec-Ablauf ausführen
#
# Ausgaben (CSV/JSON/PNG) erscheinen automatisch unter ./outputs/ auf dem Host.
# Das HuggingFace-Modell wird beim ersten Start heruntergeladen und danach
# im Volume 'hf-cache' gespeichert – kein erneuter Download bei Neustarts.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Prototyp 1: Word2Vec
  word2vec:
    build:
      context: .                            # Projektroot als Build-Kontext
      dockerfile: src/word2vec/Dockerfile   # Dockerfile des Word2Vec-Prototyps
    volumes:
      - ./outputs:/app/outputs              # Ergebnisse (Tabellen, Figuren, Modell)
      - ./data:/app/data                    # Korpus-Download/Zwischenstände persistent
    stdin_open: true                        # Für 'docker compose run word2vec bash'
    tty: true

  # Prototyp 2: Sentence-BERT 
  sbert:
    build:
      context: .                            # Projektroot als Build-Kontext
      dockerfile: src/sbert/Dockerfile      # Dockerfile des SBERT-Prototyps
    volumes:
      - ./outputs:/app/outputs              # Ergebnisse direkt auf dem Host
      - hf-cache:/root/.cache/huggingface   # Modell-Cache (einmaliger Download)
    stdin_open: true                        # Für 'docker compose run sbert bash'
    tty: true

# Benannte Volumes 
volumes:
  hf-cache:
    # Persistenter Cache für HuggingFace-Modelle (sentence-transformers).
    # Bleibt auch nach 'docker compose down' erhalten.
    # Zum vollständigen Löschen: docker volume rm <projektname>_hf-cache
